name: GCP Bootstrap (初期構築)

on:
  workflow_dispatch:

env:
  PROJECT_ID: "crypto-autotrading-lab"
  REGION: "asia-northeast1"
  ARTIFACT_REGISTRY: "crypto-autotrading-lab"
  GCS_BUCKET: "crypto-autotrading-lab"
  BUILDER_SA: "cloud-build-builder"
  RUNNER_SA: "crypto-autotrading-lab-runner"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_BOOTSTRAP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable GCP APIs
        run: |
          echo "Enabling necessary GCP APIs..."
          gcloud services enable \
            cloudbuild.googleapis.com \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            storage.googleapis.com \
            iam.googleapis.com \
            cloudresourcemanager.googleapis.com

      - name: Create Artifact Registry Repository
        run: |
          OUTPUT=$(gcloud artifacts repositories describe ${{ env.ARTIFACT_REGISTRY }} --location=${{ env.REGION }} 2>&1 || true)
          if echo "$OUTPUT" | grep -q "NOT_FOUND"; then
            echo "Creating Artifact Registry '${{ env.ARTIFACT_REGISTRY }}'..."
            CREATE_OUT=$(gcloud artifacts repositories create ${{ env.ARTIFACT_REGISTRY }} \
              --repository-format=docker \
              --location=${{ env.REGION }} \
              --description="Docker repository for crypto autotrading lab" 2>&1) || {
                if echo "$CREATE_OUT" | grep -q "PERMISSION_DENIED"; then
                  echo "Error: 権限が不足しています (PERMISSION_DENIED)。"
                  echo "$CREATE_OUT"
                  exit 1
                else
                  echo "Error: 作成に失敗しました。"
                  echo "$CREATE_OUT"
                  exit 1
                fi
              }
            echo "Artifact Registry created."
          elif echo "$OUTPUT" | grep -q "PERMISSION_DENIED"; then
            echo "Error: Artifact Registry describe 権限が不足しています (PERMISSION_DENIED)。"
            echo "$OUTPUT"
            exit 1
          elif [ -n "$OUTPUT" ] && ! echo "$OUTPUT" | grep -q "name:"; then
            echo "Error: Artifact Registry 状態取得中に未知のエラーが発生しました。"
            echo "$OUTPUT"
            exit 1
          else
             echo "Artifact Registry '${{ env.ARTIFACT_REGISTRY }}' already exists."
          fi

      - name: Create GCS Bucket
        run: |
          OUTPUT=$(gcloud storage ls gs://${{ env.GCS_BUCKET }} 2>&1 || true)
          if echo "$OUTPUT" | grep -q "does not exist\|BucketNotFound"; then
            echo "Creating GCS Bucket 'gs://${{ env.GCS_BUCKET }}'..."
            CREATE_OUT=$(gcloud storage buckets create gs://${{ env.GCS_BUCKET }} --location=${{ env.REGION }} 2>&1) || {
              if echo "$CREATE_OUT" | grep -q "AccessDenied\|PERMISSION_DENIED"; then
                echo "Error: 権限が不足しています。"
                echo "$CREATE_OUT"
                exit 1
              else
                echo "Error: 作成に失敗しました。"
                echo "$CREATE_OUT"
                exit 1
              fi
            }
            echo "GCS Bucket created."
          elif echo "$OUTPUT" | grep -q "AccessDenied\|PERMISSION_DENIED"; then
            echo "Error: GCS Bucket ls 権限が不足しています (PERMISSION_DENIED)。"
            echo "$OUTPUT"
            exit 1
          elif [ -n "$OUTPUT" ] && ! echo "$OUTPUT" | grep -q "gs://${{ env.GCS_BUCKET }}"; then
             echo "Error: GCS Bucket 状態取得中に未知のエラーが発生しました。"
             echo "$OUTPUT"
             exit 1
          else
            echo "GCS Bucket 'gs://${{ env.GCS_BUCKET }}' already exists."
          fi

      - name: Create Cloud Build Service Account
        run: |
          SA_EMAIL="${{ env.BUILDER_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          OUTPUT=$(gcloud iam service-accounts describe $SA_EMAIL 2>&1 || true)
          if echo "$OUTPUT" | grep -q "NOT_FOUND"; then
            echo "Creating Service Account '$SA_EMAIL'..."
            CREATE_OUT=$(gcloud iam service-accounts create ${{ env.BUILDER_SA }} --display-name="Cloud Build Builder" 2>&1) || {
              if echo "$CREATE_OUT" | grep -q "PERMISSION_DENIED"; then
                echo "Error: 権限が不足しています (PERMISSION_DENIED)。"
                echo "$CREATE_OUT"
                exit 1
              else
                echo "Error: 作成に失敗しました。"
                echo "$CREATE_OUT"
                exit 1
              fi
            }

            echo "Waiting for Service Account '$SA_EMAIL' to be ready..."
            READY=false
            for i in {1..12}; do
              CHK_OUT=$(gcloud iam service-accounts describe $SA_EMAIL 2>&1 || true)
              if ! echo "$CHK_OUT" | grep -q "NOT_FOUND"; then
                echo "Service Account '$SA_EMAIL' is ready."
                READY=true
                break
              fi
              echo "Waiting... ($i/12)"
              sleep 10
            done
            if [ "$READY" = false ]; then
               echo "Error: Service Account '$SA_EMAIL' was created but is not available after wait."
               exit 1
            fi
          elif echo "$OUTPUT" | grep -q "PERMISSION_DENIED"; then
             echo "Error: サービスアカウント describe 権限が不足しています (PERMISSION_DENIED)。"
             echo "$OUTPUT"
             exit 1
          elif [ -n "$OUTPUT" ] && ! echo "$OUTPUT" | grep -q "name:"; then
             echo "Error: サービスアカウント 状態取得中に未知のエラーが発生しました。"
             echo "$OUTPUT"
             exit 1
          else
            echo "Service Account '$SA_EMAIL' already exists."
          fi

      - name: Create Cloud Run Runner Service Account
        run: |
          SA_EMAIL="${{ env.RUNNER_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          OUTPUT=$(gcloud iam service-accounts describe $SA_EMAIL 2>&1 || true)
          if echo "$OUTPUT" | grep -q "NOT_FOUND"; then
            echo "Creating Service Account '$SA_EMAIL'..."
            CREATE_OUT=$(gcloud iam service-accounts create ${{ env.RUNNER_SA }} --display-name="Cloud Run Runner" 2>&1) || {
              if echo "$CREATE_OUT" | grep -q "PERMISSION_DENIED"; then
                echo "Error: 権限が不足しています (PERMISSION_DENIED)。"
                echo "$CREATE_OUT"
                exit 1
              else
                echo "Error: 作成に失敗しました。"
                echo "$CREATE_OUT"
                exit 1
              fi
            }

            echo "Waiting for Service Account '$SA_EMAIL' to be ready..."
            READY=false
            for i in {1..12}; do
              CHK_OUT=$(gcloud iam service-accounts describe $SA_EMAIL 2>&1 || true)
              if ! echo "$CHK_OUT" | grep -q "NOT_FOUND"; then
                echo "Service Account '$SA_EMAIL' is ready."
                READY=true
                break
              fi
              echo "Waiting... ($i/12)"
              sleep 10
            done
            if [ "$READY" = false ]; then
               echo "Error: Service Account '$SA_EMAIL' was created but is not available after wait."
               exit 1
            fi
          elif echo "$OUTPUT" | grep -q "PERMISSION_DENIED"; then
             echo "Error: サービスアカウント describe 権限が不足しています (PERMISSION_DENIED)。"
             echo "$OUTPUT"
             exit 1
          elif [ -n "$OUTPUT" ] && ! echo "$OUTPUT" | grep -q "name:"; then
             echo "Error: サービスアカウント 状態取得中に未知のエラーが発生しました。"
             echo "$OUTPUT"
             exit 1
          else
            echo "Service Account '$SA_EMAIL' already exists."
          fi

      - name: Grant IAM roles
        run: |
          DEPLOYER_SA="${{ secrets.GCP_SERVICE_ACCOUNT }}"

          if [ -z "$DEPLOYER_SA" ]; then
            echo "Note: GCP_SERVICE_ACCOUNT is not set. Assuming manual deployment SA config or skipping IAM bindings."
            # In a real environment, you might define the deployer SA explicitly.
          else
            echo "Assigning least privilege roles to $DEPLOYER_SA..."

            gcloud projects add-iam-policy-binding ${{ env.PROJECT_ID }} \
              --member="serviceAccount:$DEPLOYER_SA" \
              --role="roles/cloudbuild.builds.editor" \
              --condition=None || true

            gcloud projects add-iam-policy-binding ${{ env.PROJECT_ID }} \
              --member="serviceAccount:$DEPLOYER_SA" \
              --role="roles/run.developer" \
              --condition=None || true

            gcloud projects add-iam-policy-binding ${{ env.PROJECT_ID }} \
              --member="serviceAccount:$DEPLOYER_SA" \
              --role="roles/serviceusage.serviceUsageConsumer" \
              --condition=None || true

            BUILDER_SA_EMAIL="${{ env.BUILDER_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
            RUNNER_SA_EMAIL="${{ env.RUNNER_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

            gcloud iam service-accounts add-iam-policy-binding $BUILDER_SA_EMAIL \
              --member="serviceAccount:$DEPLOYER_SA" \
              --role="roles/iam.serviceAccountUser" || true

            gcloud iam service-accounts add-iam-policy-binding $RUNNER_SA_EMAIL \
              --member="serviceAccount:$DEPLOYER_SA" \
              --role="roles/iam.serviceAccountUser" || true
          fi
