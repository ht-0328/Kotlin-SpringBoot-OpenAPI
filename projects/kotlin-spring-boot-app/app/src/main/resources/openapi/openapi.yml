openapi: 3.1.0
info:
  title: Main API
  version: 1.0.0
paths:
  /api/ping:
    $ref: './ping.yaml#/paths/~1api~1ping'
  /api/echo:
    $ref: './echo.yaml#/paths/~1api~1echo'
  /files/{fileId}/download:
    get:
      summary: Download file
      operationId: downloadFile
      tags:
        - Files
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: stream
components:
  schemas:
    PingResponse:
      $ref: './ping.yaml#/components/schemas/PingResponse'
    EchoResponse:
      $ref: './echo.yaml#/components/schemas/EchoResponse'
